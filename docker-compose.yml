services:
  app:
    build: .
    env_file: .env
    environment: &app_environment
      DB_HOST: mysql
      DB_DATABASE: exousia_realty
      DB_USERNAME: exousia
      DB_PASSWORD: local_dev_only_password
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    depends_on: [app]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: exousia_realty
      MYSQL_USER: exousia
      MYSQL_PASSWORD: local_dev_only_password
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  queue:
    build: .
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    env_file: .env
    environment: *app_environment
    depends_on: [mysql, redis]
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    environment: *app_environment
    depends_on: [mysql, redis]
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
volumes:
  mysql_data:
